<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkSpace | منصة التواصل والتخطيط</title>
    <!-- ملف التنسيق المخصص -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة الأيقونات الخارجية (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

   <!-- ==================== [ الشريط العلوي الحديث - Navbar ] ==================== -->
<header class="navbar">
    <!-- شعار المنصة -->
    <div class="logo">
        <i class="fa-solid fa-comments"></i>
        <span>TalkSpace</span>
    </div>

    <!-- أزرار التنقل السريع بين الأقسام الثلاثة -->
    <nav class="nav-links">
        <a href="#priority-section" class="nav-btn"><i class="fa-solid fa-list-check"></i> الأولويات</a>
        <a href="#canvas-section" class="nav-btn"><i class="fa-solid fa-pen-ruler"></i> الرسم</a>
        <a href="#publish-section" class="nav-btn"><i class="fa-solid fa-paper-plane"></i> النشر</a>
    </nav>

    <!-- ملف المستخدم والحالة -->
    <div class="user-profile-summary">
        <div class="user-info">
            <span class="username">مستخدم TalkSpace</span>
            <span class="user-status"><i class="fa-solid fa-circle"></i> متصل</span>
        </div>
        <div class="avatar-wrapper">
            <img id="avatar-img" src="https://via.placeholder.com/42" alt="صورة الحساب">
        </div>
    </div>
</header>
        
        <!-- معلومات حساب المستخدم -->
        <div class="user-profile-summary">
            <span id="github-username">مستخدم TalkSpace</span>
            <img id="avatar-img" src="https://via.placeholder.com/40" alt="صورة الحساب">
        </div>
    </header>

    <!-- ==================== [ محتوى اللوحة الرئيسية - Dashboard ] ==================== -->
    <main class="dashboard-container">
        
      <main class="dashboard-container">
    
    <!-- القسم الأول: شاشة كاملة -->
    <section class="full-screen-section priority-section">
        <h2><i class="fa-solid fa-list-check"></i> 1. ترتيب الأولويات والمهام</h2>
        <div class="input-group">
            <input type="text" id="task-input" placeholder="عنوان فكرة أو مقال جديد...">
            <select id="priority-select">
                <option value="high">عالية 🔥</option>
                <option value="medium" selected>متوسطة ⚡</option>
                <option value="low">منخفضة ☕</option>
            </select>
            <button id="add-task-btn"><i class="fa-solid fa-plus"></i> إضافة</button>
        </div>
        <ul id="task-list" class="task-list"></ul>
    </section>

    <!-- القسم الثاني: شاشة كاملة -->
    <section class="full-screen-section canvas-section">
        <h2><i class="fa-solid fa-pen-ruler"></i> 2. مساحة الرسم الإبداعية</h2>
        <div class="canvas-tools">
            <label>اللون:</label>
            <input type="color" id="brush-color" value="#00f2fe">
            <label>الحجم:</label>
            <input type="range" id="brush-size" min="1" max="30" value="5">
            <button id="clear-canvas"><i class="fa-solid fa-trash-can"></i> مسح</button>
            <button id="download-canvas"><i class="fa-solid fa-download"></i> حفظ الرسمة</button>
        </div>
        <div class="canvas-wrapper">
            <canvas id="paint-canvas" width="1000" height="500"></canvas>
        </div>
    </section>

    <!-- القسم الثالث: شاشة كاملة -->
    <section class="full-screen-section publish-section">
        <h2><i class="fa-solid fa-paper-plane"></i> 3. كتابة ونشر مقال</h2>
        <input type="text" id="article-title" placeholder="عنوان منشورك...">
        <textarea id="article-body" rows="8" placeholder="شارِك أفكارك مع مجتمع TalkSpace..."></textarea>
        <div class="publish-actions">
            <button id="save-draft-btn"><i class="fa-solid fa-floppy-disk"></i> حفظ مسودة</button>
            <button id="publish-github-btn" style="background: var(--border-section-3); color:#fff;"><i class="fa-brands fa-github"></i> نشر عبر GitHub Issues</button>
        </div>
    </section>

</main>

    <!-- ملف البرمجة والتفاعلات -->
    <script src="app.js"></script>
</body>
</html>
