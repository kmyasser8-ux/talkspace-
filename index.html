<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkSpace - المنصة التفاعلية</title>
    <!-- استدعاء خطوط Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <!-- مكتبة الأيقونات Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ملف التنسيق المباشر -->
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>

    <!-- الترويسة العليا -->
    <header class="main-header">
        <div class="logo-container">
            <!-- شعار الـ SVG المخصص في HEXAGON + CYBER EYE -->
            <div class="brand-logo">
                <svg fill="#000000" viewBox="-3.2 -3.2 38.40 38.40" xmlns="http://www.w3.org/2000/svg" stroke="#000000" stroke-width="0.32">
                    <g id="SVGRepo_bgCarrier">
                        <path transform="translate(-3.2, -3.2), scale(2.4)" fill="#0000ff" d="M9.166.33a2.25 2.25 0 00-2.332 0l-5.25 3.182A2.25 2.25 0 00.5 5.436v5.128a2.25 2.25 0 001.084 1.924l5.25 3.182a2.25 2.25 0 002.332 0l5.25-3.182a2.25 2.25 0 001.084-1.924V5.436a2.25 2.25 0 00-1.084-1.924L9.166.33z"></path>
                    </g>
                    <g id="SVGRepo_iconCarrier">
                        <path fill="#ffffff" d="M16 32C7.163 32 0 24.837 0 16S7.163 0 16 0s16 7.163 16 16-7.163 16-16 16zm11-15.985l-.001-.014v-.023c0-.007 0-.015-.002-.022v-.001a.52.52 0 00-.052-.188l-.003-.005-.006-.012C26.797 15.495 23.446 9.5 16 9.5S5.203 15.494 5.063 15.75a.662.662 0 00-.006.012l-.002.004a.52.52 0 00-.054.189L5 15.978v.045a.52.52 0 00.064.228c.139.255 3.492 6.249 10.937 6.249s10.797-5.994 10.936-6.249a.522.522 0 00.063-.228v-.008zM25.89 16c-.558.868-2.645 3.747-6.423 4.94l.088-.065a.278.278 0 00-.053-.478.27.27 0 00-.272.035c-.664.5-1.432.84-2.245.992a12.032 12.032 0 01-1.968 0c-2.184-.403-3.902-2.12-4.332-4.33a.601.601 0 00.212-.703c-.098-.256-.355-.412-.624-.377s-.478.252-.509.525.127.531.381.626a6.037 6.037 0 002.374 3.77C8.75 19.74 6.667 16.867 6.11 16c.563-.874 2.675-3.787 6.505-4.964a5.02 5.02 0 00-.073.052.278.278 0 00-.1.309.272.272 0 00.416.14 5.372 5.372 0 012.43-.971.268.268 0 00.05-.011 11.598 11.598 0 011.325 0 .267.267 0 00.05.011c2.252.3 4.08 2.016 4.574 4.239a.601.601 0 00-.119.724.584.584 0 001.102-.296.593.593 0 00-.457-.57 6.07 6.07 0 00-2.437-3.63c3.836 1.174 5.952 4.093 6.515 4.967zm-5.07.017c0-2.698-2.162-4.891-4.82-4.891s-4.82 2.194-4.82 4.891S13.343 20.91 16 20.91s4.82-2.195 4.82-4.892zm-.544 0c0 2.393-1.918 4.34-4.276 4.34s-4.277-1.947-4.277-4.34 1.92-4.339 4.277-4.339 4.276 1.947 4.276 4.34zm-2.7-1.343c0-.745-.519-1.386-1.24-1.53-.72-.145-1.44.247-1.72.936s-.04 1.483.573 1.894l-.428 2.627a.315.315 0 00.318.379h1.92c.209 0 .35-.17.316-.379l-.429-2.626c.431-.289.69-.777.69-1.3zm4.347 2.043a.275.275 0 00-.27-.308.274.274 0 00-.27.244 5.49 5.49 0 01-1.373 3.06.276.276 0 10.143.458.27.27 0 00.26-.086 6.041 6.041 0 001.51-3.368zm-9.87-4.868a.27.27 0 00-.385.011 6.04 6.04 0 00-1.567 3.267.276.276 0 00.27.317c.135 0 .249-.1.269-.236a5.49 5.49 0 011.423-2.968.278.278 0 00-.01-.39z"></path>
                    </g>
                </svg>
            </div>
            <h2>TalkSpace</h2>
        </div>

        <nav class="header-nav">
            <a href="#" class="nav-link active">الرئيسية</a>
            <a href="#" class="nav-link">الوجهات</a>
            <a href="#" class="nav-link">العروض</a>
        </nav>

        <div class="header-actions">
            <button id="toggle-customizer-btn" class="icon-btn" onclick="toggleCustomizer()" title="تخصيص الواجهة">
                <i class="fa-solid fa-sliders"></i>
            </button>
            <div class="user-profile">
                <i class="fa-solid fa-user"></i>
            </div>
        </div>
    </header>

    <!-- لوحة التخصيص الذكي (Customizer Panel) -->
    <aside id="customizer-panel" class="customizer-panel hidden">
        <div class="customizer-header">
            <h3><i class="fa-solid fa-wand-magic-sparkles"></i> تخصيص استوديو TalkSpace</h3>
            <button id="close-customizer-btn" class="close-btn" onclick="toggleCustomizer()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="customizer-body">
            <!-- 1. زر التبديل بين الوضع الليلي والنهاري -->
            <div class="control-group row-between">
                <label><i class="fa-solid fa-moon"></i> الوضع الليلي / النهاري</label>
                <button id="theme-toggle-btn" class="theme-toggle-pill">
                    <span id="theme-mode-label">داكن</span>
                    <i id="theme-mode-icon" class="fa-solid fa-moon"></i>
                </button>
            </div>

            <!-- 2. مغير الخلفية الديناميكية -->
            <div class="control-group">
                <label><i class="fa-solid fa-image"></i> صورة خلفية الواجهة:</label>
                <div class="input-with-btn">
                    <input type="url" id="bg-url-input" placeholder="رابط صورة مباشر..." class="custom-input">
                    <button id="apply-url-btn" class="action-btn">تطبيق</button>
                </div>
                <label for="bg-file-input" class="file-upload-btn">
                    <i class="fa-solid fa-upload"></i> رفع صورة من جهازك
                </label>
                <input type="file" id="bg-file-input" accept="image/*" style="display: none;">
                <button id="remove-bg-btn" class="reset-sub-btn">إزالة الخلفية المخصصة</button>
            </div>

            <!-- 3. ألوان النيون والتوهج -->
            <div class="control-group">
                <label><i class="fa-solid fa-droplet"></i> لون التوهج (Neon Color):</label>
                <input type="color" id="primary-color-picker" value="#00f2fe" class="color-picker-input">
            </div>

            <!-- 4. تأثير الزجاج (Blur & Opacity) -->
            <div class="control-group">
                <label><i class="fa-solid fa-eye-dropper"></i> قوة ضبابية الزجاج (Blur):</label>
                <input type="range" id="blur-range" min="0" max="30" value="15" class="range-input">
            </div>

            <!-- 5. الخطوط وحجمها -->
            <div class="control-group">
                <label><i class="fa-solid fa-font"></i> خط الواجهة:</label>
                <select id="font-family-select" class="custom-input">
                    <option value="system-ui, sans-serif">الافتراضي (System)</option>
                    <option value="'Cairo', sans-serif">القاهرة (Cairo)</option>
                    <option value="'Tajawal', sans-serif">تجوال (Tajawal)</option>
                    <option value="'Amiri', serif">أميري (Amiri)</option>
                </select>
            </div>

            <div class="control-group">
                <label><i class="fa-solid fa-text-height"></i> حجم الخط:</label>
                <input type="range" id="font-size-range" min="14" max="20" value="16" class="range-input">
            </div>

            <!-- 6. إعادة ضبط الإعدادات -->
            <button id="reset-theme-btn" class="reset-btn">
                <i class="fa-solid fa-rotate-left"></i> إرجاع الضبط الافتراضي
            </button>
        </div>
    </aside>

    <!-- المحتوى الرئيسي: معرض البطاقات الكبيرة المتعددة (CodePen-style Interactive Cards Grid) -->
    <main class="hero-container">
        <div class="cards-grid">
            
            <!-- بطاقة 1: جبال سويسرا -->
            <div class="showcase-card" style="background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=1000&auto=format&fit=crop');">
                <div class="card-overlay">
                    <span class="card-tag">GLOBE EXPRESS</span>
                    <h3 class="card-title">Switzerland Alps</h3>
                    <p class="card-subtitle">SAINT ANTONIEN</p>
                </div>
            </div>

            <!-- بطاقة 2: جبال اليابان -->
            <div class="showcase-card active-card" style="background-image: url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1000&auto=format&fit=crop');">
                <div class="card-overlay">
                    <span class="card-tag">DESTINATIONS</span>
                    <h3 class="card-title">Japan Alps</h3>
                    <p class="card-subtitle">NAGANO PREFECTURE</p>
                </div>
            </div>

            <!-- بطاقة 3: الشواطئ والصخور -->
            <div class="showcase-card" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000&auto=format&fit=crop');">
                <div class="card-overlay">
                    <span class="card-tag">HOLIDAYS</span>
                    <h3 class="card-title">Ocean Coastal</h3>
                    <p class="card-subtitle">PACIFIC PARK</p>
                </div>
            </div>

            <!-- بطاقة 4: الغابات والتلال -->
            <div class="showcase-card" style="background-image: url('https://images.unsplash.com/photo-1448375240586-882707db888b?q=80&w=1000&auto=format&fit=crop');">
                <div class="card-overlay">
                    <span class="card-tag">DISCOVER</span>
                    <h3 class="card-title">National Parks</h3>
                    <p class="card-subtitle">FOREST RESERVES</p>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js?v=4.0"></script>
</body>
</html>
