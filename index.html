<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalkSpace | منصة التواصل والتخطيط</title>
    <!-- ملف التنسيق المخصص -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة الأيقونات الخارجية (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
<!-- استدعاء خطوط القاهرة، تجوال، وأميري من Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet"> </head>
<body>

 <!-- ==================== [ شريط أيقونات احترافي - Navbar ] ==================== -->
<header class="navbar">
    <!-- شعار المنصة -->
    <div class="logo">
        <i class="fa-solid fa-comments"></i>
        <span>TalkSpace</span>
    </div>

    <!-- أزرار الأيقونات فقط للتنقل السريع -->
    <nav class="nav-icons">
        <a href="#priority-section" class="icon-btn" data-tooltip="الأولويات والمهام">
            <i class="fa-solid fa-list-check"></i>
        </a>
        <a href="#canvas-section" class="icon-btn" data-tooltip="مساحة الرسم">
            <i class="fa-solid fa-palette"></i>
        </a>
        <a href="#publish-section" class="icon-btn" data-tooltip="كتابة ونشر">
            <i class="fa-solid fa-paper-plane"></i>
        </a>
    </nav>

    <!-- ملف المستخدم بالأيقونة والدائرة الضوئية -->
    <div class="user-profile">
        <span class="status-indicator" title="متصل"></span>
        <div class="avatar-icon">
            <i class="fa-solid fa-user"></i>
        </div>
    </div>
</header>
    <!-- ==================== [ محتوى اللوحة الرئيسية - Dashboard ] ==================== -->
    <main class="dashboard-container">
        <!-- زر فتح لوحة التحكم -->
<button id="toggle-customizer-btn" class="icon-btn" title="تخصيص الواجهة">
    <i class="fa-solid fa-sliders"></i>
</button>

<!-- زر فتح لوحة التحكم المباشر -->
<button id="toggle-customizer-btn" class="icon-btn" onclick="toggleCustomizer()" title="تخصيص الواجهة">
    <i class="fa-solid fa-sliders"></i>
</button>

<!-- لوحة التخصيص والتحكم الذاتي -->
<aside id="customizer-panel" class="customizer-panel hidden">
    <!-- 1. ترويسة اللوحة وزر الإغلاق -->
    <div class="customizer-header">
        <h3><i class="fa-solid fa-paint-roller"></i> لوحة التحكم الذاتي</h3>
        <button id="close-customizer-btn" onclick="toggleCustomizer()"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- 2. محتوى اللوحة الداخلي -->
    <div class="customizer-body">
        
        <!-- قسم 1: مغير الخلفيات الديناميكية -->
        <div class="control-group">
            <label><i class="fa-solid fa-image"></i> خلفية الواجهة الديناميكية:</label>
            <div style="display: flex; gap: 5px;">
                <input type="url" id="bg-url-input" placeholder="ضع رابط صورة (https://...)" class="custom-input">
                <button id="apply-url-btn" class="sub-btn" style="width: auto; padding: 0 10px; background: var(--border-section-1, #00f2fe); color: #000;">تطبيق</button>
            </div>
            <label for="bg-file-input" class="file-upload-btn" style="margin-top: 8px;">
                <i class="fa-solid fa-upload"></i> رفع صورة من الحاسوب
            </label>
            <input type="file" id="bg-file-input" accept="image/*" style="display: none;">
            <button id="remove-bg-btn" class="sub-btn" style="margin-top: 5px;">إزالة الخلفية</button>
        </div>

        <!-- قسم 2: التحكم بالألوان -->
        <div class="control-group">
            <label><i class="fa-solid fa-droplet"></i> لون التوهج (Neon):</label>
            <input type="color" id="primary-color-picker" value="#00f2fe">
        </div>

        <!-- قسم 3: التحكم بالخطوط -->
        <div class="control-group">
            <label><i class="fa-solid fa-font"></i> نوع الخط العربي:</label>
            <select id="font-family-select" class="custom-input">
                <option value="system-ui, sans-serif">الافتراضي (System)</option>
                <option value="'Cairo', sans-serif">خط القاهرة (Cairo)</option>
                <option value="'Tajawal', sans-serif">خط تجوال (Tajawal)</option>
                <option value="'Amiri', serif">خط أميري (Amiri)</option>
            </select>
        </div>

    </div> <!-- نهاية customizer-body -->
</aside> <!-- نهاية customizer-panel -->
    
    <!-- حقل الرابط مع زر تطبيق مباشر -->
    <div style="display: flex; gap: 5px;">
        <input type="url" id="bg-url-input" placeholder="ضع رابط صورة مباشر..." class="custom-input">
        <button id="apply-url-btn" class="sub-btn" style="width: auto; padding: 0 12px; background: var(--border-section-1); color: #000; font-weight: bold;">تطبيق</button>
    </div>
    
    <label for="bg-file-input" class="file-upload-btn" style="margin-top: 8px;">
        <i class="fa-solid fa-upload"></i> رفع صورة من الحاسوب
    </label>
    <input type="file" id="bg-file-input" accept="image/*" style="display: none;">
    
    <button id="remove-bg-btn" class="sub-btn" style="margin-top: 5px;">إزالة الخلفية</button>
</div>
        <!-- 3. حجم الخط -->
        <div class="control-group">
            <label><i class="fa-solid fa-text-height"></i> حجم الخط الرئيسي:</label>
            <input type="range" id="font-size-range" min="14" max="20" value="16">
        </div>
<div class="control-group">
    <label><i class="fa-solid fa-font"></i> نوع الخط العربي:</label>
    <select id="font-family-select" class="custom-input">
        <option value="system-ui, sans-serif">الافتراضي (System)</option>
        <option value="'Cairo', sans-serif">خط القاهرة (Cairo)</option>
        <option value="'Tajawal', sans-serif">خط تجوال (Tajawal)</option>
        <option value="'Amiri', serif">خط أميري (Amiri)</option>
    </select>
</div>
        <!-- 4. إعادة التعيين -->
        <button id="reset-theme-btn" class="reset-btn">
            <i class="fa-solid fa-rotate-left"></i> إرجاع الإعدادات الافتراضية
        </button>
    </div>
</aside>
      <main class="dashboard-container">
    
    <!-- القسم الأول: شاشة كاملة -->
    <section id="priority-section" class="full-screen-section priority-section">
        <h2><i class="fa-solid fa-list-check"></i> 1. ترتيب الأولويات والمهام</h2>
        <div class="input-group">
            <input type="text" id="task-input" placeholder="عنوان فكرة أو مقال جديد...">
            <select id="priority-select">
                <option value="high">عالية 🔥</option>
                <option value="medium" selected>متوسطة ⚡</option>
                <option value="low">منخفضة ☕</option>
            </select>
            <button id="add-task-btn"><i class="fa-solid fa-plus"></i> إضافة</button>
        </div>
        <ul id="task-list" class="task-list"></ul>
    </section>

    <!-- القسم الثاني: شاشة كاملة -->
    <section class="full-screen-section canvas-section">
        <h2><i class="fa-solid fa-pen-ruler"></i> 2. مساحة الرسم الإبداعية</h2>
        <div class="canvas-tools">
            <label>اللون:</label>
            <input type="color" id="brush-color" value="#00f2fe">
            <label>الحجم:</label>
            <input type="range" id="brush-size" min="1" max="30" value="5">
            <button id="clear-canvas"><i class="fa-solid fa-trash-can"></i> مسح</button>
            <button id="download-canvas"><i class="fa-solid fa-download"></i> حفظ الرسمة</button>
        </div>
        <div class="canvas-wrapper">
            <canvas id="paint-canvas" width="1000" height="500"></canvas>
        </div>
    </section>

    <!-- القسم الثالث: شاشة كاملة -->
    <section class="full-screen-section publish-section">
        <h2><i class="fa-solid fa-paper-plane"></i> 3. كتابة ونشر مقال</h2>
        <input type="text" id="article-title" placeholder="عنوان منشورك...">
        <textarea id="article-body" rows="8" placeholder="شارِك أفكارك مع مجتمع TalkSpace..."></textarea>
        <div class="publish-actions">
            <button id="save-draft-btn"><i class="fa-solid fa-floppy-disk"></i> حفظ مسودة</button>
            <button id="publish-github-btn" style="background: var(--border-section-3); color:#fff;"><i class="fa-brands fa-github"></i> نشر عبر GitHub Issues</button>
        </div>
    </section>

</main>

    <!-- ملف البرمجة والتفاعلات -->
    <script src="app.js"></script>
</body>
</html>
